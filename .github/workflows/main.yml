name: Build Shree Kashtbhanjan Motors APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Show repository files
        run: |
          echo "Current directory:"
          pwd
          echo "Repository root:"
          ls -la
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      - name: Check required files
        run: |
          test -f www/index.html || (echo "ERROR: www/index.html missing" && exit 1)
          test -f package.json || (echo "ERROR: package.json missing" && exit 1)
          test -f capacitor.config.json || (echo "ERROR: capacitor.config.json missing" && exit 1)
          test -f scripts/build.js || (echo "ERROR: scripts/build.js missing" && exit 1)
          test -f scripts/native-bridge.js || (echo "ERROR: scripts/native-bridge.js missing" && exit 1)
          echo "All required files found."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shree-Kashtbhanjan-Motors-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
